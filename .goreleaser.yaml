version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/tgs/
    binary: tgs
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/searchtgcli/tgs/internal/cmd.Version={{.Version}}
      - -X github.com/searchtgcli/tgs/internal/cmd.Commit={{.ShortCommit}}
      - -X github.com/searchtgcli/tgs/internal/cmd.Date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
