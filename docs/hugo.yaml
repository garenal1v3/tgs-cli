baseURL: https://garenal1v3.github.io/tgs-cli/
title: tgs
enableGitInfo: true

module:
  imports:
    - path: github.com/alex-shpak/hugo-book

markup:
  highlight:
    style: onedark
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1

params:
  BookTheme: dark
  BookRepo: https://github.com/garenal1v3/tgs-cli
  BookSection: "*"
  BookSearch: true
  BookEditPath: edit/develop/docs
  BookCommitPath: commit
  BookDateFormat: 2006/01/02
  BookTranslatedOnly: true

languages:
  en:
    label: English
    contentDir: content/en
    weight: 1
    menu:
      before:
        - name: "GitHub"
          url: "https://github.com/garenal1v3/tgs-cli"
          weight: 10
  ru:
    label: Русский
    contentDir: content/ru
    weight: 2
    menu:
      before:
        - name: "GitHub"
          url: "https://github.com/garenal1v3/tgs-cli"
          weight: 10
  zh:
    label: 简体中文
    contentDir: content/zh
    weight: 3
    menu:
      before:
        - name: "GitHub"
          url: "https://github.com/garenal1v3/tgs-cli"
          weight: 10
