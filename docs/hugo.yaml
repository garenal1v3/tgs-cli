    label: English
    weight: 1
    contentDir: content/en
  ru:
    label: Русский
    weight: 2
    contentDir: content/ru
  zh:
    label: 中文
    weight: 3
    contentDir: content/zh

taxonomies:
  tag: tags
  category: categories

module:
  imports:
    - path: github.com/google/docsy
